report-only:
  enable: false
  directives:
    default-src:
      base: self
  reporting:
    plugin: none
enforce:
  enable: false
  directives:
    img-src:
      base: self
      sources:
        - 'data:'
    font-src:
      base: self
      sources:
        - 'data:'
    script-src:
      base: self
    style-src:
      base: self
  reporting:
    plugin: none
