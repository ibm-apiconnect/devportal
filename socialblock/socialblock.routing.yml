socialblock.form:
  path: '/admin/config/development/socialblock'
  defaults:
    _form: 'Drupal\socialblock\Form\SocialBlockForm'
    _title: 'IBM Social Block Settings'
  requirements:
    _permission: 'administer site configuration'
socialblock.status:
  path: "/csp-check"
  defaults:
    _controller: '\Drupal\socialblock\Controller\SocialBlockController::status'
    _title: "Session check"
  requirements:
    _access: "TRUE"
