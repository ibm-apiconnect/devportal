ibm_apic_getting_started.tutorials:
  path: "/admin/getting-started"
  defaults:
    _controller: '\Drupal\ibm_apic_getting_started\Controller\TutorialsController::page'
    _title: "Getting started"
  requirements:
    _permission: "access content"


# Legacy route for backward compatibility
ibm_apic_getting_started.generate_subtheme:
  path: "/admin/getting-started/customize-portal-theme"
  defaults:
    _controller: '\Drupal\ibm_apic_getting_started\Controller\TutorialsController::panel'
    _title: "Customizing portal theme"
    tutorial_id: "customize-portal-theme"
  requirements:
    _permission: "administer site configuration"
  options:
    _admin_route: TRUE

